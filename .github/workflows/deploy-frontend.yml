name: Deploy frontend to Vercel

on:
  push:
    branches: [master, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_DDmNq5PSmnKNgzTQ3N2WeFcy
      VERCEL_PROJECT_ID: prj_c1DjGech4pT6pyYntuxQNmZqHPIj
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      # master -> production deployment; develop -> preview deployment.
      # Both get a stable alias so the address never changes between pushes.
      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            flag="--prod"
            alias="statshub-app.vercel.app"
          else
            flag=""
            alias="statshub-dev.vercel.app"
          fi
          url=$(vercel deploy $flag --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Point the stable alias at the new deployment
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "${{ steps.deploy.outputs.alias }}" --token="$VERCEL_TOKEN"
